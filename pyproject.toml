[project]
name = "aineko"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jakob Sachs", email = "jakobs99@purelymail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "apscheduler>=3.10,<4",
    "caldav>=3.1.0",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "markdown-it-py>=3.0,<4",
    "matrix-nio[e2e]>=0.25,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-frontmatter>=1.1,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
    "feedparser>=6.0,<7",
    "watchfiles>=1.0,<2",
    "markitdown>=0.1.5",
    "litellm>=1.70,<2",
]

[project.scripts]
aineko = "aineko.__main__:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore:This is a rather awkward situation:DeprecationWarning:docker",
]

[dependency-groups]
dev = [
    "hypothesis>=6.151.10",
    "testcontainers[postgres]>=4",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.35.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8,<1",
]
