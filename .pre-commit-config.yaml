repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uvx ruff check --fix
        language: system
        types: [python]

      - id: black
        name: black
        entry: uvx black src/ tests/
        language: system
        pass_filenames: false
        always_run: true

      - id: unit-tests
        name: unit tests
        entry: uv run pytest -n4 --tb=short -q tests/
        language: system
        pass_filenames: false
        always_run: true
