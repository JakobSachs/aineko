services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aineko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aineko}
      POSTGRES_DB: ${POSTGRES_DB:-aineko}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aineko}"]
      interval: 5s
      timeout: 3s
      retries: 10

  aineko:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ~/Obsidian:/data/vault:ro
      - chroma-cache:/root/.cache/chroma
      - ~/.cache/uv:/root/.cache/uv
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      TZ: UTC

volumes:
  chroma-cache:
  postgres-data:
