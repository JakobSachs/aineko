services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aineko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aineko}
      POSTGRES_DB: ${POSTGRES_DB:-aineko}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aineko}"]
      interval: 5s
      timeout: 3s
      retries: 10

  aineko:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ~/Obsidian:/data/vault:ro
      - /opt/rocm:/opt/rocm:ro
      - /usr/lib/x86_64-linux-gnu/libstdc++.so.6:/usr/lib/x86_64-linux-gnu/libstdc++.so.6:ro
      - chroma-cache:/root/.cache/chroma
      - ~/.cache/uv:/root/.cache/uv
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      TZ: UTC
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      - keep-groups
    security_opt:
      - label=disable  # sometimes needed for amdgpu

volumes:
  chroma-cache:
  postgres-data:
